aid: afalight
name: Afalight
description: >-
  Afalight (Shenzhen Afalight Co., Ltd. / 深圳市埃尔法光电科技有限公司) is a Shenzhen-based
  optoelectronics manufacturer founded in 2016 that designs and builds next-generation
  photoelectric modules, optical engines and active optical cable assemblies. Its
  HDFiberLink, HEXWaveLink and FSO AxisLink product families cover HDMI, USB-C, DVI and
  LC single/dual-fiber optical modules plus fiber-optic extenders carrying IR and RS-232
  control, aimed at ultra-high-definition and 8K video transport, split TVs, mobile
  handsets, projectors, VR gaming rigs, industrial and medical imaging, and automotive
  electronics. The company is a Chinese national high-tech enterprise, a member of the
  World Ultra HD Video Industry Alliance (CUVA) and the Shenzhen 8K Ultra HD Video
  Industry Cooperation Alliance (SUVA), holds ISO 9001 / ISO 14001 / ISO 45001 and IECQ
  HSPM certification, and reports more than 60 patents, four PCT filings and a CNAS-
  accredited laboratory. It is a hardware supplier: it publishes no developer program,
  no public API, and no machine-readable API contract of any kind.
